<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiverso</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="stylesheet" href="style.css">

    <script src="busca.js" defer></script>
    <script src="personagem.js" defer></script>
</head>

<body class="pagina-personagem">

    <header class="topo">
        <a href="index.html" class="topo-logo">
            <i class="fa-solid fa-arrow-left"></i>
            Multiverso
        </a>

        <div class="busca busca-compacta">
            <input
                type="text"
                id="campo-busca"
                class="busca-campo"
                placeholder="Buscar outro personagem"
                autocomplete="off"
                aria-label="Nome ou número do personagem"
            >
            <button id="botao-busca" class="busca-botao" type="button" aria-label="Buscar">
                <i class="fa-solid fa-magnifying-glass"></i>
            </button>
        </div>
    </header>

    <p id="mensagem-erro" class="mensagem-erro mensagem-erro-topo" role="alert" hidden></p>

    <main class="conteudo">

        <p id="carregando" class="carregando">Abrindo portal...</p>

        <div id="aviso" class="aviso" hidden>
            <i class="fa-solid fa-circle-exclamation"></i>
            <p id="aviso-texto"></p>
            <a href="index.html" class="aviso-link">Voltar para a busca</a>
        </div>

        <article id="ficha" class="ficha" hidden>

            <section class="ficha-topo">
                <figure class="ficha-arte">
                    <img id="foto" src="" alt="">
                </figure>

                <div class="ficha-identidade">
                    <span id="numero" class="ficha-numero"></span>
                    <h1 id="nome" class="ficha-nome"></h1>
                    <p id="especie" class="ficha-categoria"></p>
                    <div class="etiquetas">
                        <span id="status" class="etiqueta etiqueta-status"></span>
                        <span id="genero" class="etiqueta"></span>
                    </div>
                </div>
            </section>

            <table class="medidas">
                <thead>
                    <tr>
                        <th><i class="fa-solid fa-earth-americas"></i> Origem</th>
                        <th><i class="fa-solid fa-location-dot"></i> Último local</th>
                        <th><i class="fa-solid fa-tv"></i> Episódios</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td id="origem"></td>
                        <td id="local"></td>
                        <td id="total-episodios"></td>
                    </tr>
                </tbody>
            </table>

            <section class="bloco">
                <h2>Aparições</h2>
                <ul id="episodios" class="episodios"></ul>
            </section>

        </article>

    </main>

</body>

</html>
